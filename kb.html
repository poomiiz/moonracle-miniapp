<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoonRacle KB</title>
<link rel="manifest" href="kb.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoonRacle KB">
<meta name="theme-color" content="#12111c">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Mobile take on the KB "ภาพรวม" dashboard; dark only, matching the desktop KB. */
:root{--bg:#12111c;--panel:#1b1a29;--line:#2a2840;--fg:#e8e6f3;--muted:#8d8aa6;--accent:#7c6cf0;--num:#8ea2ff;--warn:#f2c14e;--ok:#3ecf8e;--bad:#f05d5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px calc(80px + env(safe-area-inset-bottom));font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;margin:0}
h1 span{color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
/* Bottom menu bar like a phone app: every section is one thumb tap away. */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:4px 0 env(safe-area-inset-bottom);z-index:9}
button{font:inherit;color:inherit;cursor:pointer}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:12px}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:8px}.chips button{min-height:44px;flex-shrink:0!important;padding:10px 16px!important}.category{font:inherit;color:inherit;min-height:64px;text-align:left;cursor:pointer;width:100%}.group-title{margin:16px 0 10px;color:var(--muted)}
.chips button,.act button{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:14px}
.chips button{padding:8px 2px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.grid .card{margin:0}
.wide{grid-column:1/-1}
.tile .head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px;font-weight:600}
.tile .n{font-size:24px;font-weight:700;color:var(--num);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.sub b{font-weight:600;font-variant-numeric:tabular-nums}
.y{color:var(--warn)}.g{color:var(--ok)}.r{color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:0 0 8px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--bad)}
input,textarea,select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;margin-bottom:8px}

textarea{min-height:120px}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:8px 0;font-size:14px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.primary{background:var(--accent)!important;border-color:transparent!important;color:#fff}
svg{display:block;width:100%;height:64px}
</style>
</head>
<body>
<header><h1><span>☾</span> MoonRacle KB</h1><div class="status" id="status"></div></header>
<nav id="tabs"></nav>
<div id="view"></div>
<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand?.();
// API base defaults to the tunnel host; ?api= overrides for testing.
const API = "https://kb.moonracle.com";
const TABS = [["overview","🏠","ภาพรวม"],["production","🎬","การผลิต"],["knowledge","📚","ความรู้"]];
const CATEGORIES = [["overview","🏠 ภาพรวม","งานและทีม"],["content","📝 คอนเทนต์โพสต์","การผลิต"],["music","🎵 เพลง","การผลิต"],["film","🎬 หนังสั้น","การผลิต"],["products","🛍 วิดีโอสินค้า","การผลิต"],["characters","🤖 ตัวละคร","การผลิต"],["trends","📈 ข่าวและกระแสวันนี้","ความรู้"],["tarot","🃏 ไพ่ Tarot","ความรู้"],["dhamma","🙏 ธรรมะ","ความรู้"],["divination","🧭 เครื่องมือพยากรณ์","ความรู้"],["notebook","📒 NotebookLM","ความรู้"]];
const STATUSES = [["pending","รอทำ"],["in_progress","กำลังทำ"],["review","รอตรวจ"],["completed","เสร็จแล้ว"],["blocked","ติดปัญหา"]];
const view = document.getElementById("view");
let current = "overview", status = "pending", counts = null;

// Inside Telegram we send signed initData; in a normal browser we use an verified Telegram Login bearer token.
function token() { try { return sessionStorage.getItem("kb_token"); } catch { return null; } }
function authHeaders() {
  const headers = {"Content-Type": "application/json"};
  if (tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
  else if (token()) headers["Authorization"] = "Bearer " + token();
  return headers;
}
async function api(path, opts = {}) {
  const headers = authHeaders();
  const r = await fetch(API + path, {...opts, headers});
  if (r.status === 401 && !tg.initData) { try { sessionStorage.removeItem("kb_token"); } catch {} login(); throw new Error("กรุณาล็อกอิน"); }
  if (r.status === 401) throw new Error("เข้าไม่ได้ ต้องเปิดผ่านปุ่มใน @nongmoonbot");
  if (!r.ok) {
    const problem = await r.json().catch(() => ({}));
    throw new Error(typeof problem.detail === "string" ? problem.detail : "เกิดข้อผิดพลาด " + r.status);
  }
  return r.json();
}
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function fail(e) { if (!tg.initData && !token()) return; view.replaceChildren(el("p", e.message, "err")); }
function popup(msg) { tg.initData ? tg.showAlert(msg) : alert(msg); }
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-US");
// "label <b class=cls>value</b>" pairs, built without innerHTML.
function sub(...pairs) {
  const d = el("div", null, "sub");
  pairs.forEach(([label, value, cls], i) => { if (i) d.append(" · "); d.append(label + " "); d.append(el("b", fmt(value), cls)); });
  return d;
}
function tile(title, n, subs, pct, onclick) {
  const c = el("div", null, "card tile"), h = el("div", null, "head");
  h.append(el("span", title), el("span", fmt(n), "n"));
  c.append(h, ...subs);
  if (pct != null) { const b = el("div", null, "bar"), i = el("i"); i.style.width = Math.max(0, Math.min(100, pct)) + "%"; b.append(i); c.append(b); }
  if (onclick) c.onclick = onclick;
  return c;
}
// go() takes a menu key or a task status; a status opens the "งาน" menu on that status.
function go(tab) {
  if (STATUSES.some(([k]) => k === tab)) { status = tab; tab = "tasks"; }
  current = tab; renderTabs(); show();
}

function renderTabs() {
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, icon, label]) => {
    const b = el("button", null, k === current ? "on" : "");
    b.append(el("i", icon), el("span", label));
    b.onclick = () => go(k);
    return b;
  }));
}
function show() {
  if (current !== "room") window.MoonRoom?.stop();
  tg.BackButton.hide();
  if (current === "room") centralRoom();
  else if (current === "overview") overview();
  else if (["news","content"].includes(current)) news();
  else if (current === "production" || current === "knowledge") workMenu();
  else list();
}

async function overview() {
  view.replaceChildren(el("p", "กำลังโหลด…", "meta"));
  const get = p => api(p).catch(() => null);
  const [meta, music, film, jobs, nlm, cron, intel] = await Promise.all([
    get("/dashboard/meta"), get("/music/api/stats"), get("/film/episodes"),
    get("/bot/api/jobs?site=flow&limit=100"), get("/api/notebooklm/status"), get("/api/cron/jobs"), get("/dc/agent-intel")]);
  if (!meta) return fail(new Error("ดึงข้อมูลไม่ได้ คอมอาจปิดอยู่"));
  const st = document.getElementById("status"); st.replaceChildren(el("span", "● ", meta.vault_ok ? "g" : "y"), "API OK · " + new Date().toLocaleTimeString("th-TH", {hour: "2-digit", minute: "2-digit"}));

  const o = counts = meta.task_open_counts || {}, open = (o.pending || 0) + (o.in_progress || 0) + (o.review || 0) + (o.blocked || 0);
  const cronOn = cron?.jobs ? cron.jobs.filter(j => j.enabled).length : null;
  const grid = el("div", null, "grid");
  grid.append(tile("งานระบบ", open, [sub(["กำลังทำ", o.in_progress], ["รอตรวจ", o.review, "y"], ["ติดปัญหา", o.blocked, "r"]), sub(["งานอัตโนมัติเปิด", cronOn])], null, () => go("review")));
  grid.lastChild.classList.add("wide");
  if (music) {
    grid.append(tile("เพลง", music.total, [sub(["มีลิงก์", music.has_social, "y"], ["คลิปสั้น", music.shorts_count, "y"])], music.total ? 100 * (music.has_social || 0) / music.total : null));
    grid.append(tile("MV", music.has_mv, [sub(["ยอดดู", music.mv_views, "g"])], music.total ? 100 * (music.has_mv || 0) / music.total : null));
  }
  if (Array.isArray(film)) {
    const qc = film.filter(e => e.status === "qc_passed").length, pub = film.filter(e => e.status === "published").length;
    grid.append(tile("หนังสั้น", film.length, [sub(["ผ่าน QC", qc, "y"], ["ลงแล้ว", pub, "g"])], film.length ? 100 * pub / film.length : null));
  }
  if (Array.isArray(jobs)) {
    const sv = jobs.filter(j => j.created_by === "shopee-video" && j.action === "video" && j.payload?.shopee_video);
    const files = sv.filter(j => (j.result?.files || []).some(f => /\.(mp4|webm)$/i.test(String(f)))).length;
    const running = sv.filter(j => ["queued", "running"].includes(j.status)).length;
    grid.append(tile("วิดีโอ Shopee", sv.length, [sub(["มีไฟล์", files, "y"], ["รอ/กำลังทำ", running, "y"])]));
  }
  if (nlm?.topics) grid.append(tile("NotebookLM", nlm.topics.length, [sub(["กำลังทำ", nlm.topics.filter(t => /run|progress/i.test(t.status || "")).length, "y"])]));

  const know = el("div", null, "card");
  know.append(el("h2", "ความรู้"));
  [["Dev logs", meta.dc_dev_logs, "y"], ["Learnings", meta.learnings_total, "g"], ["แหล่งความรู้ RAG", meta.rag_chunks, "g"], ["Chunks ไม่มี embedding", meta.rag_backlog, "y"]].forEach(([k, v, c]) => {
    const r = el("div", null, "row"); r.append(el("span", k), el("b", fmt(v), c)); know.append(r);
  });

  const trend = el("div", null, "card"), vel = meta.task_velocity || [];
  const done7 = vel.reduce((s, d) => s + (d.count || 0), 0);
  trend.append(el("h2", "แนวโน้มงาน 7 วัน"), el("div", `เสร็จ ${done7} งาน · วันนี้ ${fmt(meta.today_done)}`, "sub"));
  if (vel.length > 1) trend.append(spark(vel.map(d => d.count || 0)));

  const team = el("div", null, "card");
  team.append(el("h2", "ผลงานทีม"));
  if (Array.isArray(intel) && intel.length) {
    [...intel].sort((a, b) => (b.task_count || 0) - (a.task_count || 0)).slice(0, 5).forEach(a => {
      const r = el("div", null, "row"); r.append(el("span", a.agent), el("b", `${fmt(a.task_count)} งาน · ${Math.round((a.overall_success_rate || 0) * (a.overall_success_rate <= 1 ? 100 : 1))}%`));
      team.append(r);
    });
  } else team.append(el("div", "ยังไม่มีข้อมูล", "sub"));

  const widgets = await overviewWidgets();
  if (current !== "overview") return;
  view.replaceChildren(...widgets, grid, trend, know, team);
}

function spark(vals) {
  const w = 300, h = 64, max = Math.max(1, ...vals), step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 6 - (v / max) * (h - 12)).toFixed(1)}`).join(" ");
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), line = document.createElementNS(ns, "polyline");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("preserveAspectRatio", "none");
  line.setAttribute("points", pts); line.setAttribute("fill", "none"); line.setAttribute("stroke", "#7c6cf0"); line.setAttribute("stroke-width", "2.5"); line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(line); return svg;
}

function workMenu() {
  view.replaceChildren();
  for (const group of [current === 'knowledge' ? 'ความรู้' : 'การผลิต']) {
    const grid = el('div', null, 'grid');
    CATEGORIES.filter(item => item[2] === group).forEach(([key, label]) => {
      const button = el('button', label, 'card category'); button.type = 'button';
      button.onclick = () => key === 'overview' ? go('overview') : key === 'content' ? go('content') : key === 'trends' ? go('news') : newTask({category:key, label}); grid.append(button);
    });
    view.append(el('h2', group, 'group-title'), grid);
  }
}
function newTask(seed = {}) {
  const c = el("div", null, "card"), title = el("input"), detail = el("textarea"), pri = el("select"), send = el("button", "ส่งงานให้น้องมูน", "primary");
  title.placeholder = "หัวข้องาน"; title.maxLength = 150; detail.placeholder = "รายละเอียด";
  title.value = seed.title || ""; detail.value = seed.description || "";
  [["normal", "ปกติ"], ["low", "ต่ำ"], ["high", "สูง"]].forEach(([v, t]) => { const o = el("option", t); o.value = v; pri.append(o); });
  const act = el("div", null, "act"); act.append(send);
  send.onclick = async () => {
    if (!title.value.trim()) return popup("ใส่หัวข้องานก่อน");
    send.disabled = true;
    try {
      const t = await api("/tasks", {method: "POST", body: JSON.stringify({title: (seed.label ? seed.label + ": " : "") + title.value.trim(), description: detail.value.trim(), priority: pri.value, assigned_agent: "Moon", context: {work_category: seed.category || "general", work_category_label: seed.label || "งานทั่วไป"}, project: "moonracle-kb"})});
      counts = null; popup("ส่งงานแล้ว #" + String(t.id).slice(0, 8)); workMenu();
    } catch (e) { popup(e.message); send.disabled = false; }
  };
  const back = el("button", "← เลือกหมวดใหม่"); back.type = "button"; back.onclick = workMenu;
  title.setAttribute("aria-label", "หัวข้องาน"); detail.setAttribute("aria-label", "รายละเอียดงาน"); pri.setAttribute("aria-label", "ความสำคัญ");
  c.append(back, el("h2", "สั่งงาน · " + (seed.label || "งานทั่วไป")), title, pri, detail, act);
  view.replaceChildren(c);
}

function chips() {
  const d = el("div", null, "chips");
  d.append(...STATUSES.map(([k, label]) => {
    const b = el("button", counts?.[k] != null ? `${label} ${fmt(counts[k])}` : label, k === status ? "on" : "");
    b.onclick = () => go(k);
    return b;
  }));
  return d;
}

async function list() {
  view.replaceChildren(el("p", "กำลังโหลด…", "meta"));
  try {
    if (!counts) counts = (await api("/dashboard/meta").catch(() => null))?.task_open_counts || null;
    const tasks = await api(`/tasks?status=${status}&limit=50`);
    if (!tasks.length) return view.replaceChildren(el("p", "ไม่มีงาน", "meta"));
    view.replaceChildren(...tasks.map(t => {
      const c = el("div", null, "card");
      c.append(el("div", t.title), el("div", `${t.project || "-"} · ${t.priority || "-"} · ${t.assigned_agent || "-"}`, "meta"));
      c.onclick = () => detail(t.id);
      return c;
    }));
  } catch (e) { fail(e); }
}

async function detail(id) {
  tg.BackButton.show();
  try {
    const t = await api(`/tasks/${encodeURIComponent(id)}`);
    const c = el("div", null, "card");
    c.append(el("h2", t.title), el("div", `${t.status} · ${t.project || "-"} · ${t.priority || "-"} · ${t.assigned_agent || "-"}`, "meta"));
    if (t.blocked_reason) c.append(el("pre", "ติดอยู่: " + t.blocked_reason));
    if (t.description) c.append(el("pre", t.description));
    if (t.handoff_notes) c.append(el("pre", "ส่งต่อ: " + t.handoff_notes));
    const act = el("div", null, "act");
    if (t.status === "review") act.append(statusBtn(t.id, "completed", "ผ่าน ปิดงาน"), statusBtn(t.id, "in_progress", "ส่งกลับไปแก้"));
    if (t.status === "blocked") act.append(statusBtn(t.id, "pending", "ปลดให้ทำต่อ"));
    c.append(act);
    view.replaceChildren(c);
  } catch (e) { fail(e); }
}

function statusBtn(id, status, label) {
  const b = el("button", label);
  const run = async ok => {
    if (!ok) return;
    try { await api(`/tasks/${encodeURIComponent(id)}`, {method: "PATCH", body: JSON.stringify({status})}); counts = null; show(); }
    catch (e) { popup(e.message); }
  };
  // Telegram popups only work inside Telegram; plain browsers use confirm().
  b.onclick = () => tg.initData ? tg.showConfirm(`ยืนยัน: ${label}?`, run) : run(confirm(`ยืนยัน: ${label}?`));
  return b;
}

async function login() {
  try { sessionStorage.removeItem("kb_token"); } catch {}
  document.querySelector("nav").replaceChildren();
  const card = el("div", null, "card"), message = el("p", "ล็อกอินด้วย Telegram ที่ปุ่มด้านล่าง เสร็จแล้วหน้างานจะเปิดในเว็บแอปนี้", "sub");
  const actions = el("div", null, "act");
  card.append(el("h2", "เข้าสู่ระบบด้วย Telegram"), message, actions); view.replaceChildren(card);
  try {
    const response = await fetch(API + "/auth/telegram/config");
    const config = await response.json();
    if (!response.ok) throw new Error(config.detail || "เชื่อม Telegram ไม่ได้");
    window.onTelegramLogin = async user => {
      try {
        const response = await fetch(API + "/auth/telegram/verify", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user, nonce: config.nonce})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "เข้าสู่ระบบไม่สำเร็จ");
        sessionStorage.setItem("kb_token", data.token); renderTabs(); show();
      } catch (error) {
        message.textContent = error.message; const retry = el("button", "ลองเข้าสู่ระบบใหม่"); retry.type = "button"; retry.onclick = login; actions.replaceChildren(retry);
      }
    };
    const widget = document.createElement("script");
    widget.src = "https://telegram.org/js/telegram-widget.js?22";
    widget.dataset.telegramLogin = config.bot_username;
    widget.dataset.size = "large"; widget.dataset.userpic = "false";
    widget.dataset.onauth = "onTelegramLogin(user)";
    widget.async = true; actions.append(widget);
  } catch (error) { message.textContent = error.message + " · กดรีเฟรชแล้วลองใหม่"; }
}

tg.BackButton.onClick(show);
if (!tg.initData && !token()) login(); else { renderTabs(); show(); }
</script>
<script src="kb-news.js"></script>
<script src="room.js"></script>
<script src="kb-overview.js"></script>
</body>
</html>
